server {
    server_name funflick.in www.funflick.in 98.130.142.69;

    root /var/www/funflick-web;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # CRITICAL: Never cache index.html - always serve fresh to pick up new JS/CSS hashes
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Cache static Vite assets (hashed filenames) for 1 year - safe because filenames change on deploy
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache public static files
    location ~* \.(svg|ico|png|jpg|jpeg|gif|webp|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Backend Express API Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Allow large video & media uploads
        client_max_body_size 200M;
    }

    # SPA routing fallback - serve index.html for all React routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/funflick.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/funflick.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.funflick.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = funflick.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name funflick.in www.funflick.in 98.130.142.69;
    return 404; # managed by Certbot
}
